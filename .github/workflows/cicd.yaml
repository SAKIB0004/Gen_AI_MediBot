name: Deploy Streamlit Docker Image to EC2

on:
  push:
    branches:
      - main

jobs:
  continuous-integration:
    name: Build and Push Image to Amazon ECR
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPO }}
          IMAGE_TAG: latest
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "Building image: $IMAGE_URI"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

  continuous-deployment:
    name: Deploy on EC2 self-hosted runner
    needs: continuous-integration
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Free Docker disk space on runner
        run: |
          docker stop medibot || true
          docker rm medibot || true
          docker container prune -f || true
          docker image prune -a -f || true
          docker builder prune -a -f || true
          docker volume prune -f || true
          docker system df || true

      - name: Pull latest image from ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPO }}
          IMAGE_TAG: latest
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "Pulling image: $IMAGE_URI"
          docker pull "$IMAGE_URI"

      - name: Stop and remove old container
        run: |
          docker stop medibot || true
          docker rm medibot || true

      - name: Run new container
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPO }}
          IMAGE_TAG: latest
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "Running image: $IMAGE_URI"

          docker run -d \
            --name medibot \
            --restart unless-stopped \
            -e PINECONE_API_KEY="$PINECONE_API_KEY" \
            -e GROQ_API_KEY="$GROQ_API_KEY" \
            -p 8501:8501 \
            "$IMAGE_URI"

      - name: Show running containers
        run: docker ps

      - name: Show app logs
        run: docker logs medibot --tail 100 || true